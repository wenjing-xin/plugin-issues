name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-ci.yaml@v5
    with:
      ui-path: "ui"
      pnpm-version: ""
      node-version: "22.12.0"
      java-version: "21"
