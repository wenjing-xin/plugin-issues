name: CD

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Test release validation
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate public release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/validate-release.py

  check:
    needs: validate
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-ci.yaml@v5
    with:
      ui-path: "ui"
      pnpm-version: "10.12.4"
      node-version: "22.12.0"
      java-version: "21"

  cd:
    needs: check
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-cd.yaml@v5
    secrets:
      halo-pat: ${{ secrets.HALO_PAT }}
    permissions:
      contents: write
    with:
      app-id: app-vxihanjo
      node-version: "22.12.0"
      pnpm-version: "10.12.4"
      java-version: "21"
      ui-path: "ui"
      artifacts-path: "build/libs"
      skip-appstore-release: false
      sync-github-readme: false
