apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # The name defines how the plugin is invoked, A unique name
  name: issues
spec:
  enabled: true
  requires: ">=2.20.0"
  author:
    name: webjing
    website: https://github.com/halo-dev
  logo: logo.png
  homepage: https://github.com/halo-dev/plugn-starter#readme
  repo: https://github.com/wenjing-xin/plugin-issues
  issues: https://github.com/wenjing-xin/plugin-issues/issues
  displayName: "Issue留言"
  description: "这是一个专门为halo2.0提供的issue留言插件，可用于产品QA、问答交流"
  license:
    - name: "GPL-3.0"
      url: "https://github.com/wenjing-xin/plugin-issues/blob/main/LICENSE"
