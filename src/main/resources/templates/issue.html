<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}">
<th:block th:fragment="head">
    <title th:text="${issueVO.spec.title}">Issues</title>
    <th:block th:replace="~{plugin:PluginIssues:fragments/assets :: head(version=${pluginVersion})}" />
</th:block>
<th:block th:fragment="content">
    <th:block th:replace="~{plugin:PluginIssues:fragments/pages/issue :: content}" />
</th:block>
</html>
