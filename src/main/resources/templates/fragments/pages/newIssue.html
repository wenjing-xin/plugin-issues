<section xmlns:th="https://www.thymeleaf.org" th:fragment="content"
         class="piw-app piw-github" data-piw-root x-ignore x-data="piwApp"
         th:attr="data-avatar-size=${diceBarAvatarSize},data-avatar-style=${diceBarAvatarStyle}">
<th:block th:with="currentUser = ${contributorFinder.getContributor(#authentication.name)}">
    <th:block th:replace="~{plugin:PluginIssues:fragments/header::header(subjectType = ${issueSubjectInfo.subjectType}, title = ${issueSubjectInfo.title}, name = ${issueSubjectInfo.name},
    totalIssue = ${issueSubjectStats.awaitIssue + issueSubjectStats.progressIssue}, activeTab = 'issues' )}" />
    <section class="piw-columns piw-page piw-container piw-mx-auto piw-py-6 piw-flex lg:piw-flex-nowrap lg:piw-gap-x-4 piw-flex-wrap"
        th:attr="x-data=|{issueSubjectName:'${issueSubjectInfo.name}', templateName: PluginIssues.getSpecialParam('template'), issueTemplateModal: false}|">
        <!-- 表单提交部分  -->
        <div class="lg:piw-w-[68%] piw-w-full" x-data="piwIssueSubmit(issueSubjectName, templateName)">
            <div class="piw-w-full piw-space-y-0.5">
                <h1 class="piw-page-title">创建新 Issue</h1><p class="piw-description">清楚描述问题，帮助大家更快地理解和处理。</p>
                <div class="piw-flex piw-items-center piw-gap-x-1 piw-h-6" x-show="templateName != ''">
                    <p class="piw-text-xs" x-text="issueTemplateRender.displayName"></p>
                    <button type="button"
                        class="piw-outline-none piw-text-xs piw-text-blue-500 hover:piw-border-b hover:piw-border-blue-500 piw-transition-all duration-300"
                        @click="issueTemplateModal = true">选择其他模版</button>
                </div>
            </div>
            <!-- 模版选择   -->
            <th:block th:if="${ not #lists.isEmpty(issueSubjectInfo.issueTemplates)}">
                <th:block th:replace="~{plugin:PluginIssues:fragments/issue-template-select}" />
            </th:block>
            <!-- 基础信息表单  -->
            <form class="piw-w-full piw-rounded piw-py-4 piw-space-y-6" x-data="piwIssueEditor"
                @submit.prevent="submitForm(rawContent, preview)">
                <!-- 标题 -->
                <div>
                    <label class="piw-block piw-text-sm piw-font-medium piw-mb-1" for="title">
                        标题 <span class="piw-text-red-500">*</span>
                    </label>
                    <input id="title" x-model="issueForm.spec.title" type="text" required
                        class="piw-w-full piw-text-sm piw-border piw-border-gray-300 piw-rounded-md piw-py-2 piw-px-2 focus:piw-outline-none focus:piw-ring-2 focus:piw-ring-blue-400 piw-transition"
                        placeholder="请输入标题">
                </div>
                <th:block th:replace="~{plugin:PluginIssues:fragments/template-fields}" />
                <!-- 描述 -->
                <div>
                    <label class="piw-block piw-text-sm piw-font-medium piw-mb-2">描述</label>
                    <th:block th:replace="~{plugin:PluginIssues:fragments/IssueEditor}" />
                </div>
                <!-- 提交按钮 -->
                <div class="piw-w-full piw-flex piw-justify-between piw-items-center" x-data="piwDiceBearAvatar(avatarStyle,size)">
                    <div class="piw-w-10" th:attr="x-data=|{ issueOwnerName: '${currentUser.name}'}|">
                        <th:block
                            th:replace="~{plugin:PluginIssues:fragments/macro/ownerAvatar::ownerAvatar(avatar = ${currentUser.avatar}, name=${currentUser.name})}" />
                    </div>
                    <div class="piw-flex piw-justify-end piw-space-x-2">
                        <button type="button"
                            class="piw-button piw-button-outline"
                            @click="cancelCreate()">取消</button>
                        <button type="submit" :disabled="saveLoading || templateLoading || !!templateError || rawContent.trim() == ''"
                                @mouseenter="if(rawContent.trim() == ''){PluginIssues.showTooltip('请填入Issue描述', $event)}"
                                @mouseleave="if(rawContent.trim() == ''){PluginIssues.hideTooltip()}"
                            class="piw-button piw-button-primary">
                            <span class="text-lg piw-icon-[eos-icons--loading]" x-show="saveLoading"></span>
                            <span x-text="submitText" class="piw-text-white piw-text-sm"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!--  右侧信息栏 -->
        <div class="piw-sidebar lg:piw-w-[28%] lg:piw-sticky piw-w-full piw-h-full piw-space-y-2 piw-divide-y piw-divide-slate-200">
            <div class="piw-space-y-2 piw-py-3">
                <p class="piw-text-sm piw-tracking-wider">经办人</p>
                <p class="piw-text-sm piw-tracking-wider piw-text-neutral-400">
                    暂无经办人
                </p>
            </div>
            <div class="piw-space-y-2 piw-py-3">
                <p class="piw-text-sm piw-tracking-wider">标签</p>
                <p class="piw-text-sm piw-tracking-wider piw-text-neutral-400">
                    暂无标签
                </p>
            </div>
        </div>
    </section>
</th:block>
</section>
