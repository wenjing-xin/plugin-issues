<template x-teleport="body" xmlns:th="https://www.thymeleaf.org">
    <div class="piw-app piw-portal">
        <dialog class="piw-dialog" aria-labelledby="piw-template-dialog-title"
                x-effect="if (issueTemplateModal &amp;&amp; !$el.open) $el.showModal(); else if (!issueTemplateModal &amp;&amp; $el.open) $el.close()"
                @close="issueTemplateModal = false" @cancel.prevent="issueTemplateModal = false"
                @keydown.escape.prevent.stop="issueTemplateModal = false">
            <button type="button" class="piw-button piw-button-ghost piw-button-icon piw-dialog-close" aria-label="关闭模板选择" @click="issueTemplateModal=false"><span class="piw-icon-[lucide--x]"></span></button>
            <h2 id="piw-template-dialog-title" class="piw-section-title">选择 Issue 模板</h2>
            <p class="piw-description">选择适合的模板，让问题描述更完整。</p>
            <div class="piw-dialog-list">
                <a th:each="issueTemplateItem : ${issueSubjectInfo.issueTemplates}" class="piw-dialog-option"
                   th:href="${'/subject/' + issueSubjectInfo.name + '/issues/new?template=' + issueTemplateItem.metadataName}">
                    <div><p th:text="${issueTemplateItem.templateName}"></p><p class="piw-caption" th:text="${issueTemplateItem.description}"></p></div>
                    <span class="piw-icon-[lucide--arrow-right]" aria-hidden="true"></span>
                </a>
            </div>
        </dialog>
    </div>
</template>
