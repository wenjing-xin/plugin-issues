<header th:fragment="header(subjectType, title, name, totalIssue, activeTab)" class="piw-subject-header">
    <div class="piw-container piw-header-top" x-data="piwDiceBearAvatar(avatarStyle,size)">
        <a class="piw-breadcrumb" th:href="${'/subject/' + name}">
            <span class="piw-icon-[lucide--messages-square]" aria-hidden="true"></span>
            <span class="piw-muted-text" th:switch="${subjectType + ''}">
                <span th:case="'POST'">文章</span><span th:case="'PROJECT'">项目</span>
                <span th:case="'PRODUCT'">产品</span><span th:case="'TOPIC'">话题</span>
                <span th:case="'LEAVE_MESSAGE'">留言</span>
            </span>
            <span class="piw-muted-text" aria-hidden="true">/</span>
            <span class="piw-breadcrumb-title" th:text="${title}"></span>
        </a>
        <div class="piw-user-menu" x-data="piwDropdown"
             th:with="currentUser = ${contributorFinder.getContributor(#authentication.name)}"
             @keydown.escape.window="close()" @click.outside="close()">
            <button type="button" class="piw-button piw-button-ghost piw-button-icon"
                    aria-label="用户菜单" aria-haspopup="true" :aria-expanded="show" @click="show = !show">
                <span sec:authorize="isAnonymous()" class="piw-icon-[lucide--circle-user-round]" aria-hidden="true"></span>
                <th:block sec:authorize="isAuthenticated()">
                    <img th:if="${not #strings.isEmpty(currentUser.avatar)}" th:src="${currentUser.avatar}" th:alt="${currentUser.displayName}" class="piw-user-avatar" />
                    <span th:if="${#strings.isEmpty(currentUser.avatar)}" class="piw-user-initial" th:text="${#strings.substring(currentUser.displayName, 0, 1)}"></span>
                </th:block>
            </button>
            <div class="piw-dropdown" x-cloak x-show="show" x-transition.opacity>
                <a sec:authorize="isAuthenticated()" href="/console" target="_blank" rel="noopener">
                    <span class="piw-icon-[lucide--layout-dashboard]"></span>控制台
                </a>
                <a sec:authorize="isAuthenticated()" href="/logout"><span class="piw-icon-[lucide--log-out]"></span>退出登录</a>
                <a sec:authorize="isAnonymous()" href="/login" onclick="this.href = '/login?redirect_uri=' + encodeURIComponent(window.location.href)">
                    <span class="piw-icon-[lucide--log-in]"></span>登录
                </a>
            </div>
        </div>
    </div>
    <nav class="piw-container piw-tabs" aria-label="Issue 主体导航">
        <a th:href="${'/subject/' + name}" class="piw-tab" th:classappend="${activeTab == 'subject' ? 'piw-tab-active' : ''}" th:attr="aria-current=${activeTab == 'subject' ? 'page' : null}">
            <span class="piw-icon-[lucide--layout-grid]" aria-hidden="true"></span>概览
        </a>
        <a th:href="${'/subject/' + name + '/issues'}" class="piw-tab" th:classappend="${activeTab == 'issues' ? 'piw-tab-active' : ''}" th:attr="aria-current=${activeTab == 'issues' ? 'page' : null}">
            <span class="piw-icon-[lucide--circle-dot]" aria-hidden="true"></span>Issues
            <span class="piw-count" th:text="${totalIssue}"></span>
        </a>
    </nav>
</header>
