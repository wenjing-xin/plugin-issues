<th:block th:fragment="issueItem(issueVO)">
    <div class="issue-item">
        <div class="flex items-start gap-4">
            <img src="https://github.com/identicons/example.png" alt="avatar" class="w-10 h-10 rounded-full ring-2 ring-gray-100">
            <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between mb-1">
                    <div class="flex items-center space-x-2">
                        <h3 class="font-medium text-gray-900">示例留言标题</h3>
                        <span class="px-2 py-0.5 rounded-full text-xs font-medium bg-green-50 text-green-600 border border-green-100">
                                      新留言
                                  </span>
                    </div>
                    <div class="flex items-center space-x-1">
                        <button class="p-1 text-gray-400 hover:text-blue-500 transition-colors" title="编辑">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                            </svg>
                        </button>
                        <button class="p-1 text-gray-400 hover:text-red-500 transition-colors" title="删除">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="text-sm text-gray-500 mb-3">
                    <span class="font-medium text-gray-700">用户名</span>
                    <span class="mx-1">·</span>
                    <time>2024年3月20日</time>
                </div>
                <div class="text-gray-600 text-sm leading-relaxed">
                    <p>这是一条示例留言内容，展示了基本的留言格式。这里可以支持 Markdown 格式的文本。</p>
                    <pre class="mt-2 p-3 bg-gray-50 rounded-lg text-xs font-mono text-gray-700">console.log("Hello World");</pre>
                </div>
                <div class="flex items-center space-x-4 mt-4 pt-4 border-t border-gray-100">
                    <button class="text-gray-500 hover:text-blue-500 flex items-center space-x-1 group transition-colors text-sm">
                        <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                        <span>回复</span>
                    </button>
                    <button class="text-gray-500 hover:text-red-500 flex items-center space-x-1 group transition-colors text-sm">
                        <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                        </svg>
                        <span>12</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</th:block>
