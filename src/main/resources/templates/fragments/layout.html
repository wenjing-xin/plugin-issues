<!DOCTYPE html>
<!-- Compatibility adapter for themes that used the original layoutHtml fragment. -->
<html xmlns:th="https://www.thymeleaf.org"
      th:fragment="layoutHtml(title, content, version, head)"
      th:replace="~{layout :: html(head = ~{::pageHead}, content = ~{::pageContent})}">
<th:block th:fragment="pageHead">
    <title th:text="${title}">Issues</title>
    <th:block th:replace="~{plugin:PluginIssues:fragments/assets :: head(version=${version})}" />
    <th:block th:if="${head != null}"><th:block th:replace="${head}" /></th:block>
</th:block>
<section th:fragment="pageContent" class="piw-app" data-piw-root x-ignore x-data="piwApp"
         th:attr="data-avatar-size=${diceBarAvatarSize},data-avatar-style=${diceBarAvatarStyle}">
    <th:block th:replace="${content}" />
</section>
</html>
