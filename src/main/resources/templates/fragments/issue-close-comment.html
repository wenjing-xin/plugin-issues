<template x-teleport="body">
    <div class="piw-app piw-portal">
        <dialog class="piw-dialog" aria-labelledby="piw-close-dialog-title"
                x-effect="if (issueClosedModal &amp;&amp; !$el.open) $el.showModal(); else if (!issueClosedModal &amp;&amp; $el.open) $el.close()"
                @close="issueClosedModal = false" @cancel.prevent="issueClosedModal = false"
                @keydown.escape.prevent.stop="issueClosedModal = false">
            <button type="button" class="piw-button piw-button-ghost piw-button-icon piw-dialog-close" aria-label="关闭弹窗" @click="issueClosedModal=false"><span class="piw-icon-[lucide--x]"></span></button>
            <h2 id="piw-close-dialog-title" class="piw-section-title">关闭 Issue</h2>
            <p class="piw-description">说明关闭原因，帮助参与者了解处理结果。</p>
            <div class="piw-stack piw-mt-6">
                <div><label for="closedComment" class="piw-block piw-mb-2">关闭原因 <span class="piw-text-red-500">*</span></label>
                    <input id="closedComment" x-model="closedComment" type="text" required placeholder="请输入关闭原因" /></div>
                <div class="piw-flex piw-justify-end piw-gap-2">
                    <button type="button" class="piw-button piw-button-outline" @click="issueClosedModal=false">取消</button>
                    <button type="button" class="piw-button piw-button-primary" @click="PluginIssues.closeIssue(issueId, closedComment);issueClosedModal=false;">确认关闭</button>
                </div>
            </div>
        </dialog>
    </div>
</template>
