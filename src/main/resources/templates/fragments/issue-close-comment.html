<template x-teleport="body">
    <div>
        <div class="piw-fixed piw-inset-0 piw-z-50 piw-bg-gray-700/30 piw-opacity-100 piw-backdrop-blur-sm dark:piw-bg-black/80"
             aria-hidden="true"
             x-show="issueClosedModal"
             x-transition:enter="ease-in-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="ease-in-out duration-300"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
        ></div>
        <div class="piw-fixed piw-inset-0 piw-z-50 piw-overflow-y-auto"
             tabindex="-1"
             x-show="issueClosedModal"
             x-transition:enter="ease-out duration-200"
             x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
             x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
             x-transition:leave="ease-in duration-100"
             x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
             x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95">
            <div class="piw-flex piw-min-h-full piw-flex-col piw-items-center piw-justify-center piw-text-center sm:piw-p-0">
                <div @click.outside="issueClosedModal = false" class="piw-relative piw-transform piw-overflow-hidden piw-rounded-lg piw-bg-white piw-text-left
                piw-shadow-xl piw-transition-all sm:piw-w-full sm:piw-max-w-xl piw-divide-y piw-divide-slate-300">
                    <div class="piw-flex piw-justify-between piw-items-center piw-px-5 piw-py-3">
                        <h1 class="piw-text-sm piw-font-semibold">填写Issue关闭原因</h1>
                        <div class="piw-size-7 piw-rounded-full hover:piw-cursor-pointer piw-bg-slate-100 piw-inline-flex piw-items-center piw-justify-center hover:piw-bg-slate-200 piw-transition-all piw-duration-300"
                             @click="issueClosedModal=false">
                            <span class="piw-icon-[material-symbols--close-rounded] text-lg"></span>
                        </div>
                    </div>
                    <div class="piw-w-full piw-rounded piw-py-4 piw-space-y-6 piw-px-5">
                        <!-- 标题 -->
                        <div>
                            <label class="piw-block piw-text-sm piw-font-medium piw-mb-1" for="closedComment">
                                关闭原因 <span class="piw-text-red-500">*</span>
                            </label>
                            <input id="closedComment" x-model="closedComment" type="text" required
                                   class="piw-w-full piw-text-sm piw-border piw-border-gray-300 piw-rounded-md piw-py-2 piw-px-2 piw-focus:outline-none piw-focus:ring-2 piw-focus:ring-blue-400 piw-transition"
                                   placeholder="请输入关闭原因">
                        </div>
                        <div class="piw-flex piw-justify-end piw-space-x-2">
                            <button class="piw-bg-gray-100 piw-text-gray-600 piw-text-sm piw-px-3 piw-py-1 piw-rounded-md piw-border piw-border-gray-200 piw-transition hover:piw-bg-gray-200"
                                    @click="issueClosedModal=false">取消</button>
                            <button @click="main.closeIssue(issueId, closedComment);issueClosedModal=false;"
                                    class="piw-bg-green-600 piw-px-4 piw-py-1 piw-rounded-md piw-shadow-sm piw-transition hover:piw-bg-green-700 transition-all duration-300 inline-flex items-center gap-x-1">
                                <span class="piw-text-white piw-text-sm">提交</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
