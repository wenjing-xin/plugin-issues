  - apiGroups: ["issue.webjing.com"]
    resources: ["issuetemplates"]
    verbs: ["get", "list"]
  - apiGroups: ["console.api.issueTemplate.webjing.com"]
    resources: ["issuetemplates" ]
    verbs: ["get", "list"]
---
apiVersion: v1alpha1
kind: Role
