apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-someone-publish-new-issue
spec:
  reasonSelector:
    reasonType: someone-publish-new-issue
    language: default
  template:
    title: "[(${issueOwner})]在【[(${subjectType})]】—— [(${subjectDisplayName})] 中创建了新的issue"
    rawBody: |
      [(${receiveOwner})] 你好：

      [[${issueOwner}]] 创建了新的issue“[(${issueMessageRawContent})]”， 以下是Issue的具体内容：

      [(${issueHtmlContent})]
    htmlBody: |
      <div style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f9fc;">
        <!-- 外层容器 -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f7f9fc">
          <tr>
            <td align="center" style="padding: 40px 0;">
              <!-- 内容容器 -->
              <table width="100%" max-width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
                <!-- 头部 -->
                <tr>
                  <td bgcolor="#4f46e5" style="padding: 30px; text-align: center; border-radius: 12px 12px 0 0;">
                    <h1 style="margin: 0; color: white; font-size: 24px;">【[(${subjectType})]】[(${subjectDisplayName})] 有新的Issue</h1>
                    <p style="color: rgba(255,255,255,0.8); margin: 10px 0 0; font-size: 16px;">
                      <span th:text="${receiveOwner} + '，您好！您关注的' + ${subjectType} + 'issue有更新'"></span>
                    </p>
                  </td>
                </tr>
                <tr>
                  <td style="padding: 30px;">
                    <!-- 状态标签 -->
                    <div th:style="${approved} ? 
                        'background-color: #dcfce7; color: #166534; padding: 10px 15px; border-radius: 6px; display: inline-block; margin-bottom: 20px;' : 
                        'background-color: #fee2e2; color: #b91c1c; padding: 10px 15px; border-radius: 6px; display: inline-block; margin-bottom: 20px;'">
                        <strong>状态：</strong>
                        <span th:text="${issueStatus}"></span>
                        <span th:if="${approved}" style="margin-left: 10px;">✓ 已审核通过</span>
                        <span th:unless="${approved}" style="margin-left: 10px;">Ⓥ 待审核</span>
                    </div>
                    <div style="border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-bottom: 25px;">
                        <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td width="30%" style="padding: 8px 0; color: #6b7280;">标题</td>
                                <td style="padding: 8px 0; font-weight: 500;" th:text="${issueTitle}"></td>
                            </tr>
                            <tr>
                                <td style="padding: 8px 0; color: #6b7280;">创建者</td>
                                <td style="padding: 8px 0;" th:text="${issueOwner}"></td>
                            </tr>
                            <tr>
                                <td style="padding: 8px 0; color: #6b7280;">创建时间</td>
                                <td style="padding: 8px 0;" th:text="${issueCreatedAt}"></td>
                            </tr>
                        </table>
                    </div>
                    <table width="100%" cellpadding="0" cellspacing="0">
                      <tr>
                        <td align="center">
                            <a th:href="${issuePermalink}" style="display: inline-block; background-color: #4f46e5; color: white; text-decoration: none; padding: 12px 30px; border-radius: 6px; font-weight: 500; margin: 10px 0 20px;">
                                查看完整内容
                            </a>
                        </td>
                      </tr>
                    </table>
                    <!-- 原始内容 -->
                    <div style="background-color: #f9fafb; border-radius: 8px; padding: 20px; margin-top: 15px;">
                      <h3 style="margin-top: 0; color: #4b5563;">原始内容</h3>
                      <div style="background-color: white; padding: 15px; border-radius: 6px; border: 1px solid #e5e7eb; font-family: monospace; white-space: pre-wrap; font-size: 14px; max-height: 150px; overflow: auto;" th:utext="${issueHtmlContent}"></div>
                    </div>
                  </td>
                </tr>
                <!-- 页脚 -->
                <tr>
                  <td bgcolor="#f9fafb" style="padding: 20px 30px; text-align: center; border-radius: 0 0 12px 12px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 14px;">
                    <p style="margin: 0;">此邮件由系统自动发送，请勿直接回复</p>
                    <a th:href="${site.url}" style="margin: 5px 0 0;">[[${site.title}]] 保留所有权利</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </div>
---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-someone-comment-issue
spec:
  reasonSelector:
    reasonType: someone-comment-issue
    language: default
  template:
    title: "[(${issueCommentOwner})] 于 [(${issueCommentCreatedAt})] 时刻创建了新的评论"
    rawBody: |
      [(${subscriber.displayName})] 你好：

      [(${receiveOwner})] 评论了 issue “[(${issueTitle})]”， 以下是评论的具体内容：

      [(${issueHtmlContent})]
    htmlBody: |
      <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; line-height: 1.5; color: #24292e; max-width: 600px; margin: 0 auto; padding: 20px;">
        <div style="border: 1px solid #e1e4e8; border-radius: 6px; overflow: hidden;">
          <div style="background-color: #f6f8fa; padding: 16px; border-bottom: 1px solid #e1e4e8;">
            <h1 style="font-size: 20px; font-weight: 600; margin: 0;">[(${issueTitle})] 
              <div th:style="${isApproved} ? 'font-size: 12px;background-color: #dcfce7; color: #166534; padding:2px 8px; border-radius: 12px; display: inline-block;' : 
                      'font-size: 12px;background-color: #fee2e2; color: #b91c1c; padding: 2px 8px; border-radius: 12px; display: inline-block;'">
                <span th:if="${isApproved}" style="margin-left: 10px;">✓ 已审核通过</span>
                <span th:if="${not isApproved}" style="margin-left: 10px;">Ⓥ 待审核</span>
              </div>
            </h1>
          </div>
          <div style="padding: 16px;">
            <div style="display: flex; align-items: center; margin-bottom: 16px;">
                <div style="width: 36px; height: 36px; border-radius: 50%; margin-right: 12px; background-color: #e1e4e8; display: flex; justify-content: center; align-items: center;">
                  <span style="font-weight: 600; font-size: 20px; color: #24292e; line-height: 1; text-align: center;" th:text="${#strings.substring(issueCommentOwner, 0, 1)}"></span>
                </div>
                <div style="font-size: 14px;">
                    <div style="font-weight: 600;">[(${issueCommentOwner})]</div>
                    <div style="color: #586069; font-size: 12px;">[(${issueCommentCreatedAt})]</div>
                </div>
            </div>
            <div style="margin-bottom: 16px; padding: 16px; background-color: #f6f8fa; border-radius: 6px; font-size: 14px;">
              [(${issueCommentHtmlContent})]
            </div>
            <div style="text-align: center;">
              <a th:href="${issueCommentPermalink}" style="display: inline-block; padding: 8px 16px; background-color: #2ea44f; color: white; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 500;">查看评论</a>
            </div>
          </div>
        </div>
      </body>
---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-someone-reply-issue-comment
spec:
  reasonSelector:
    reasonType: someone-reply-issue-comment
    language: default
  template:
    title: "[(${issueReplyCommentOwner})] 于 [(${issueReplyCommentCreatedAt})] 时刻回复评论"
    rawBody: |
      [(${subscriber.displayName})] 你好：

      [(${notifyTitle})]， 以下是评论的具体内容：

      [(${issueReplyCommentRawContent})]
    htmlBody: |
      <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; line-height: 1.5; color: #24292e; max-width: 600px; margin: 0 auto; padding: 20px;">
        <div style="border: 1px solid #e1e4e8; border-radius: 6px; overflow: hidden; margin-bottom: 20px;">
          <div style="background-color: #f6f8fa; padding: 16px; border-bottom: 1px solid #e1e4e8;">
              <h1 style="font-size: 18px; font-weight: 600; margin: 0;">[(${notifyTitle})] 
                 <div th:style="${isApproved} ? 'font-size: 12px;background-color: #dcfce7; color: #166534; padding:2px 8px; border-radius: 12px; display: inline-block;' : 
                      'font-size: 12px;background-color: #fee2e2; color: #b91c1c; padding: 2px 8px; border-radius: 12px; display: inline-block;'">
                   <span th:if="${isApproved}" style="margin-left: 10px;">✓ 已审核通过</span>
                   <span th:if="${not isApproved}" style="margin-left: 10px;">Ⓥ 待审核</span>
                </div>
              </h1>
          </div>

          <div style="padding: 16px;">
            <div style="font-size: 14px; color: #586069; margin-bottom: 16px;">[(${receiveOwner})]</div>

            <!-- 原始评论 -->
            <div style="margin-bottom: 16px; padding: 16px; background-color: #f6f8fa; border-radius: 6px; border-left: 4px solid #e1e4e8;">
                <div style="display: flex; align-items: center; margin-bottom: 12px;">
                  <div style="width: 36px; height: 36px; border-radius: 50%; margin-right: 12px; background-color: #e1e4e8; display: flex; justify-content: center; align-items: center;">
                        <span style="font-weight: 600; font-size: 20px; color: #24292e; line-height: 1; text-align: center;" th:text="${#strings.substring(receiveOwner, 0, 1)}"></span>
                  </div>
                  <div style="font-size: 14px;">
                    <style>
                      blockquote {
                        margin: 1.5em 0;
                        padding: 1em 1.5em;
                        background: #f9f9f9;
                        border-left: 4px solid #7a9cbf;
                        color: #555;
                        font-style: italic;
                        position: relative;
                      }
                      blockquote::before {
                        content: "“";
                        font-family: Georgia, serif;
                        font-size: 3em;
                        position: absolute;
                        left: 10px;
                        top: -10px;
                        color: #7a9cbf;
                      }
                    </style>
                    <div style="font-weight: 600;">[(${receiveOwner})]</div>
                  </div>
                </div>
                <div style="font-size: 14px;" th:utext="${issueCommentHTMLContent}">
                </div>
            </div>

            <!-- 回复评论 -->
            <div style="margin-bottom: 16px; padding: 16px; background-color: #ffffff; border-radius: 6px; border: 1px solid #e1e4e8; border-left: 4px solid #2ea44f; margin-left: 24px;">
                <div style="display: flex; align-items: center; margin-bottom: 12px;">
                    <div style="width: 36px; height: 36px; border-radius: 50%; margin-right: 12px; background-color: #e1e4e8; display: flex; justify-content: center; align-items: center;">
                        <span style="font-weight: 600; font-size: 20px; color: #24292e; line-height: 1; text-align: center;" th:text="${#strings.substring(issueReplyCommentOwner, 0, 1)}"></span>
                    </div>
                    <div style="font-size: 14px;">
                        <div style="font-weight: 600;">[(${issueReplyCommentOwner})]</div>
                        <div style="color: #586069; font-size: 12px;">[(${issueReplyCommentCreatedAt})]</div>
                    </div>
                </div>
                <div style="font-size: 14px;" th:utext="${issueReplyCommentHTMLContent}">
                </div>
            </div>

            <div style="text-align: center;">
                <a th:href="${permalink}" style="display: inline-block; padding: 8px 16px; background-color: #2ea44f; color: white; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 500;">查看完整讨论</a>
            </div>
          </div>
        </div>
      </div>
---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-manager-closed-issue
spec:
  reasonSelector:
    reasonType: manager-closed-issue
    language: default
  template:
    title: "[(${closedOwner})] 于 [(${issueClosedTime})] 时刻关闭了issue「[(${issueTitle})]」"
    rawBody: |
      [(${receiveOwner})] 你好：

      你的的issue「[(${issueTitle})]」已经被[(${closedOwner})]关闭， 以下是Issue关闭的原因：

      [(${closedComment})]
    htmlBody: |
      <div style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; background-color: #f5f7fa; line-height: 1.5;">
        <!-- 外层容器 -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f5f7fa" style="max-width: 600px; margin: 0 auto;">
          <tr>
            <td align="center" style="padding: 40px 20px;">
              <!-- 内容容器 -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.05); overflow: hidden;">
                <!-- 头部 -->
                <tr>
                  <td bgcolor="#4f46e5" style="padding: 32px 30px; text-align: center;">
                    <h1 style="margin: 0; color: white; font-size: 24px; font-weight: 600;">
                        <span th:text="'Issue 已关闭'"></span>
                    </h1>
                    <p style="color: rgba(255,255,255,0.85); margin: 12px 0 0; font-size: 16px;">
                        <span th:text="'您好，' + ${receiveOwner} + '！'"></span>
                        <span th:text="${subjectDisplayName} + ' 中的Issue已被关闭'"></span>
                    </p>
                  </td>
                </tr>
                <!-- 状态标识 -->
                <tr>
                  <td style="padding: 0 30px;">
                    <div style="background-color: #f1f5f9; border-radius: 8px; padding: 16px; margin: -20px 0 20px; text-align: center; border: 1px solid #e2e8f0;">
                      <div style="display: inline-flex; align-items: center; background-color: #dcfce7; color: #166534; padding: 6px 16px; border-radius: 50px; font-weight: 500;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                          <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        <span th:text="'状态：已关闭'"></span>
                      </div>
                    </div>
                  </td>
                </tr>
                <!-- 主要内容 -->
                <tr>
                  <td style="padding: 0 30px 30px;">
                    <!-- Issue基本信息 -->
                    <div style="border: 1px solid #e2e8f0; border-radius: 12px; padding: 0; margin-bottom: 28px;">
                      <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
                        <tr>
                          <td colspan="2" style="padding: 20px; border-bottom: 1px solid #e2e8f0; background-color: #f8fafc;">
                              <h2 style="margin: 0; font-size: 18px; color: #1e293b;" th:text="${issueTitle}"></h2>
                          </td>
                        </tr>
                        <tr>
                          <td style="padding: 16px 20px; width: 35%; color: #64748b; font-weight: 500; border-bottom: 1px solid #f1f5f9;">依托主体</td>
                          <td style="padding: 16px 20px; border-bottom: 1px solid #f1f5f9; color: #334155;" th:text="${subjectDisplayName} + ' (' + ${subjectType} + ')'"></td>
                        </tr>
                        <tr>
                          <td style="padding: 16px 20px; color: #64748b; font-weight: 500; border-bottom: 1px solid #f1f5f9;">创建者</td>
                          <td style="padding: 16px 20px; border-bottom: 1px solid #f1f5f9; color: #334155;" th:text="${issueOwner}"></td>
                        </tr>
                        <tr>
                          <td style="padding: 16px 20px; color: #64748b; font-weight: 500; border-bottom: 1px solid #f1f5f9;">关闭者</td>
                          <td style="padding: 16px 20px; border-bottom: 1px solid #f1f5f9; color: #334155;" th:text="${closedOwner}"></td>
                        </tr>
                        <tr>
                          <td style="padding: 16px 20px; color: #64748b; font-weight: 500;">关闭时间</td>
                          <td style="padding: 16px 20px; color: #334155;" th:text="${issueClosedTime}"></td>
                        </tr>
                      </table>
                    </div>
                    <!-- 关闭原因 -->
                    <div style="margin-bottom: 28px;">
                      <h3 style="margin: 0 0 12px; font-size: 16px; color: #1e293b; font-weight: 600;">关闭原因</h3>
                      <div style="background-color: #f8fafc; border-radius: 8px; padding: 20px; border-left: 4px solid #4f46e5;">
                        <div th:utext="${closedComment}" style="color: #475569; line-height: 1.6;"></div>
                      </div>
                    </div>
                    <!-- 操作按钮 -->
                    <table width="100%" cellpadding="0" cellspacing="0">
                      <tr>
                        <td align="center">
                          <a th:href="${issuePermalink}" style="display: inline-block; background-color: #4f46e5; color: white; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-weight: 500; font-size: 16px; transition: all 0.2s;">
                              查看完整 Issue
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </div>