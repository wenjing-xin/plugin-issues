apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-issues-settings
spec:
  forms:
    - group: issuesBasic
      label: 基本设置
      formSchema:
        - $formkit: text
          name: title
          label: 标题
          value: 9
          help: "Issue页面显示标题，用于浏览器标题或者页面标题显示"
        - $formkit: number
          name: pageSize
          label: 分页大小
          value: 9
          max: 20
          min: 4
          help: "最大二十条，最小4条"

